name: Deploy static site to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to gh-pages branch (avoid deprecated upload-artifact)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          # If you want the site at the repository root (https://USERNAME.github.io/REPO),
          # set `publish_branch: gh-pages` (default) and leave repository settings to serve from gh-pages.

      # Note: This workflow publishes the repository contents to the gh-pages branch.
      # After a successful run, go to GitHub repo Settings -> Pages and set the source to gh-pages branch (if not automatic).
